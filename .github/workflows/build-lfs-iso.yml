name: Build LFS-CN Live ISO

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      resume:
        description: '构建级别: full=全量(工具链+基础+配置+ISO); from-base=跳过工具链+基础(用上次 base 快照, 重跑配置+extras+ISO); from-config=跳过配置+extras(用上次 config 快照, 只做内核+ISO); only-packages=用上次 config 快照, 只构建 pacman 包仓库并部署 Pages(不产 ISO)。push 时可用 commit message 标记 [iso:full]/[iso:from-base]/[iso:from-config]/[iso:only-packages] 覆盖；无标记或标记无效时默认 only-packages（绝不意外触发全量）'
        type: choice
        default: only-packages
        options:
          - full
          - from-base
          - from-config
          - only-packages

permissions:
  contents: read
  actions: read

env:
  RUNNER_OS: ubuntu-latest
  CCACHE_DIR: /home/runner/ccache
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 1500M
  CCACHE_SLOPPINESS: include_file_ctime,include_file_mtime,time_macros

jobs:
  # ---------------------------------------------------------------
  # Job 0: resolve build level (dispatch input or commit-message tag)
  # ---------------------------------------------------------------
  mode:
    name: Resolve build level
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.set.outputs.mode }}
    env:
      COMMIT_MSG: ${{ github.event.head_commit.message }}
    steps:
      - id: set
        run: |
          # SAFE DEFAULT: anything unrecognized (no marker, or a typo like
          # [iso:config]/[iso:packages]) must NEVER fall back to a full
          # multi-hour build. only-packages is cheap and harmless.
          mode="only-packages"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ inputs.resume }}"
            case "$mode" in
              full|from-base|from-config|only-packages) ;;
              *) mode="only-packages" ;;
            esac
          else
            mode=$(printf '%s\n' "$COMMIT_MSG" | grep -oE '\[iso:(full|from-base|from-config|only-packages)\]' | tail -1 | cut -d: -f2 | tr -d ']')
            mode="${mode:-only-packages}"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
  # ---------------------------------------------------------------
  # Job 1: host prep + cross toolchain (LFS ch5 + ch6)
  # ---------------------------------------------------------------
  toolchain:
    name: Toolchain (ch5+ch6)
    needs: mode
    if: ${{ needs.mode.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install host prerequisites + download sources
        run: bash scripts/01-host-prep.sh

      - name: Cache restore (ccache)
        uses: actions/cache/restore@v4
        id: ccache-restore
        with:
          path: /home/runner/ccache
          key: ccache-${{ hashFiles('scripts/**', 'tools/x86_64/md5sums') }}
          restore-keys: |
            ccache-

      - name: Build cross toolchain and temporary tools
        run: |
          set -o pipefail
          bash scripts/02-toolchain.sh 2>&1 | tee /home/runner/toolchain.log

      - name: DIAGNOSE pre-snapshot tree (TEMP)
        run: |
          stat -c '%F %N' /mnt/lfs/usr /mnt/lfs/usr/bin /mnt/lfs/usr/bin/env /mnt/lfs/bin /mnt/lfs/lib /mnt/lfs/lib64 /mnt/lfs/tools 2>&1
          ls -la /mnt/lfs 2>&1 | head -20
          ls -la /mnt/lfs/usr/bin 2>&1 | head -25
          readlink -f /mnt/lfs/usr/bin/env 2>&1

      - name: Snapshot toolchain
        run: bash scripts/common.sh --snapshot toolchain

      - name: Cache save (ccache)
        if: steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/ccache
          key: ccache-${{ hashFiles('scripts/**', 'tools/x86_64/md5sums') }}

      - uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: snapshot-toolchain
          path: .artifacts/toolchain.tar.zst.part-*
          retention-days: 7

      - name: Upload failure logs (toolchain)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: toolchain-failure-logs
          path: |
            /home/runner/toolchain.log
            /mnt/lfs/sources/.diag/
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------
  # Job 2: chroot base system (ch7 + ch8)
  # ---------------------------------------------------------------
  base:
    name: Base system (ch8)
    needs: [mode, toolchain]
    if: ${{ needs.mode.outputs.mode == 'full' && needs.toolchain.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: snapshot-toolchain
          path: .artifacts

      - name: Create swap for build memory spikes (GCC -O3 systemd)
        run: |
          set -ex
          if swapon --show --noheadings 2>/dev/null | grep -q .; then
            echo "swap already active:"
            swapon --show
          elif [ -f /swapfile ]; then
            echo "/swapfile exists, enabling it"
            sudo swapon /swapfile
          else
            echo "creating /swapfile"
            sudo fallocate -l 4G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          free -h

      - name: Restore toolchain snapshot
        run: bash scripts/common.sh --restore toolchain

      - name: DIAGNOSE restored tree (TEMP)
        run: |
          stat -c '%F %N' /mnt/lfs/usr /mnt/lfs/usr/bin /mnt/lfs/usr/bin/env /mnt/lfs/bin /mnt/lfs/lib /mnt/lfs/lib64 /mnt/lfs/tools 2>&1
          ls -la /mnt/lfs 2>&1 | head -20
          ls -la /mnt/lfs/usr/bin 2>&1 | head -25
          readlink -f /mnt/lfs/usr/bin/env 2>&1

      - name: CHROOT gcc smoke test (TEMP diag - why cannot create executables)
        run: |
          sudo bash <<'DIAG'
          set +e
          mkdir -pv /mnt/lfs/{dev,proc,sys,run}
          mount --bind /dev /mnt/lfs/dev 2>/dev/null
          mount --bind /dev/pts /mnt/lfs/dev/pts 2>/dev/null
          mount --bind /proc /mnt/lfs/proc 2>/dev/null
          mount --bind /sys /mnt/lfs/sys 2>/dev/null
          mount --bind /run /mnt/lfs/run 2>/dev/null
          echo "=== interp of gcc/cc1/ld ==="
          readelf -l /mnt/lfs/usr/bin/gcc 2>&1 | grep -A1 interpreter
          readelf -l /mnt/lfs/usr/libexec/gcc/x86_64-lfs-linux-gnu/15.2.0/cc1 2>&1 | grep -A1 interpreter
          readelf -l /mnt/lfs/usr/bin/ld 2>&1 | grep -A1 interpreter
          echo "=== loader --list deps of gcc driver ==="
          chroot /mnt/lfs /usr/lib/ld-linux-x86-64.so.2 --list /usr/bin/gcc 2>&1
          echo "=== chroot gcc -v ==="
          chroot /mnt/lfs /usr/bin/env -i HOME=/root PATH=/usr/bin:/usr/sbin /bin/bash -c "gcc -v 2>&1"
          echo "=== which progs will gcc exec ==="
          chroot /mnt/lfs /usr/bin/env -i HOME=/root PATH=/usr/bin:/usr/sbin /bin/bash -c "gcc -print-prog-name=cc1; gcc -print-prog-name=collect2; gcc -print-prog-name=as; gcc -print-prog-name=ld; gcc -print-file-name=crt1.o; gcc -print-file-name=Scrt1.o; gcc -print-search-dirs"
          echo "=== chroot smoke compile (v) ==="
          chroot /mnt/lfs /usr/bin/env -i HOME=/root PATH=/usr/bin:/usr/sbin /bin/bash -c "mkdir -p /tmp; cd /tmp; printf 'int main(){return 0;}\n' > t.c; gcc -v t.c -o t 2>&1; echo gcc_rc=\$?; if [ -x /tmp/t ]; then /tmp/t && echo SMOKE-OK || echo SMOKE-RUNFAIL; else echo NO-BINARY; fi"
          echo "=== chroot smoke compile IN /sources (reproduce gettext) ==="
          chroot /mnt/lfs /usr/bin/env -i HOME=/root PATH=/usr/bin:/usr/sbin /bin/bash -c "cd /sources; printf 'int main(){return 0;}\n' > st.c; gcc st.c -o st 2>&1; echo gcc_rc=\$?; ls -l /sources/st; ./st && echo SOURCES-SMOKE-OK || echo SOURCES-SMOKE-RUNFAIL; /sources/st; echo abs_rc=\$?"
          echo "=== mount / df ==="
          mount | grep -E 'sources|/mnt/lfs' ; df -h /sources /tmp /
          echo "=== binutils runtime (chroot) ==="
          chroot /mnt/lfs /usr/bin/env -i HOME=/root PATH=/usr/bin:/usr/sbin /bin/bash -c "ld --version 2>&1 | head -3; echo ld_rc=\$?; as --version 2>&1 | head -2; echo as_rc=\$?; ls -l /usr/x86_64-lfs-linux-gnu/bin/ 2>&1"
          echo "=== loader --list ld (NEEDED libs resolvable?) ==="
          chroot /mnt/lfs /usr/lib/ld-linux-x86-64.so.2 --list /usr/bin/ld 2>&1
          echo "=== libgcc / libbfd locations ==="
          ls -l /mnt/lfs/usr/lib/libgcc_s.so* /mnt/lfs/usr/lib/libbfd* /mnt/lfs/usr/lib/libctf* /mnt/lfs/usr/lib/libsframe* 2>&1
          find /mnt/lfs/usr -name 'libgcc.a' -o -name 'libgcc_eh.a' -o -name 'libgcc_s.so*' 2>/dev/null
          echo "=== key files ==="
          chroot /mnt/lfs /usr/bin/env -i HOME=/root PATH=/usr/bin:/usr/sbin /bin/bash -c "ls -ld /lib64 /lib /usr/lib; ls -l /lib64/ld-linux-x86-64.so.2 /usr/lib/ld-linux-x86-64.so.2 /usr/lib/libc.so.6 /usr/lib/crt1.o /usr/lib/Scrt1.o 2>&1; ls -l /usr/libexec/gcc/x86_64-lfs-linux-gnu/15.2.0/cc1 /usr/libexec/gcc/x86_64-lfs-linux-gnu/15.2.0/collect2 /usr/bin/gcc /usr/bin/ld 2>&1"
          echo "=== ld.so.conf ==="
          cat /mnt/lfs/etc/ld.so.conf 2>&1
          for d in dev/pts dev/shm dev run proc sys; do umount /mnt/lfs/$d 2>/dev/null; done
          true
          DIAG

      - name: Build base system in chroot
        run: |
          set -o pipefail
          timeout 14400 bash -c 'bash scripts/03-chroot-base.sh 2>&1 | tee /home/runner/base.log'

      - name: Snapshot base system
        run: bash scripts/common.sh --snapshot base

      - uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: snapshot-base
          path: .artifacts/base.tar.zst.part-*
          retention-days: 7

      - name: Upload failure logs (base)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: base-failure-logs
          path: |
            /home/runner/base.log
            /mnt/lfs/sources/.diag/
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------
  # Job 3: system config + extras (Node/Rust/PowerShell/Neovim, ICU,
  #         nano, freetype, fontconfig, fbterm, CJK fonts)
  # ---------------------------------------------------------------
  config-extras:
    name: Config + extras
    needs: [mode, base]
    if: ${{ always() && ( (needs.mode.outputs.mode == 'full' && needs.base.result == 'success') || needs.mode.outputs.mode == 'from-base' ) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find latest run with snapshot-base artifact
        id: find-base
        if: ${{ needs.mode.outputs.mode != 'full' }}
        run: |
          id=$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=snapshot-base&per_page=1" \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d["artifacts"][0]["workflow_run"]["id"])')
          echo "run_id=$id" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: ${{ needs.mode.outputs.mode == 'from-base' }}
        with:
          name: snapshot-base
          path: .artifacts
          run-id: ${{ steps.find-base.outputs.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        if: ${{ needs.mode.outputs.mode == 'full' }}
        with:
          name: snapshot-base
          path: .artifacts
          github-token: ${{ github.token }}

      - name: Restore base snapshot
        run: bash scripts/common.sh --restore base

      - name: System configuration (locale/network/console)
        run: bash scripts/04-sysconfig.sh

      - name: Install extras
        run: bash scripts/05-extras.sh

      - name: Snapshot configured system
        run: bash scripts/common.sh --snapshot config

      - uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: snapshot-config
          path: .artifacts/config.tar.zst.part-*
          retention-days: 7

  # ---------------------------------------------------------------
  # Job 4: kernel + initramfs + live ISO
  # ---------------------------------------------------------------
  iso:
    name: Kernel + ISO
    needs: [mode, config-extras]
    if: ${{ always() && ( needs.mode.outputs.mode == 'from-config' || needs.config-extras.result == 'success' ) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find latest run with snapshot-config artifact
        id: find-config
        if: ${{ needs.mode.outputs.mode == 'from-config' }}
        run: |
          id=$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=snapshot-config&per_page=1" \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d["artifacts"][0]["workflow_run"]["id"])')
          echo "run_id=$id" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: ${{ needs.mode.outputs.mode == 'from-config' }}
        with:
          name: snapshot-config
          path: .artifacts
          run-id: ${{ steps.find-config.outputs.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        if: ${{ needs.mode.outputs.mode != 'from-config' }}
        with:
          name: snapshot-config
          path: .artifacts
          github-token: ${{ github.token }}

      - name: Restore configured snapshot
        run: bash scripts/common.sh --restore config

      - name: Install host prerequisites (mksquashfs/grub-mkrescue/xorriso)
        run: bash scripts/01-host-prep.sh

      - name: Build kernel, initramfs and live ISO
        run: bash scripts/06-kernel-iso.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: lfs-cn-live-iso
          path: lfs-cn-*.iso
          retention-days: 14

  # ---------------------------------------------------------------
  # Job 5: build free software packages + pacman repo (parallel with iso)
  # ---------------------------------------------------------------
  packages:
    name: Free software packages
    needs: [mode, config-extras]
    if: ${{ always() && ( needs.mode.outputs.mode == 'only-packages' || needs.config-extras.result == 'success' ) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find latest run with snapshot-config artifact
        id: find-config
        if: ${{ needs.mode.outputs.mode == 'from-config' || needs.mode.outputs.mode == 'only-packages' }}
        run: |
          id=$(curl -s -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=snapshot-config&per_page=1" \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d["artifacts"][0]["workflow_run"]["id"])')
          echo "run_id=$id" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: ${{ needs.mode.outputs.mode == 'from-config' || needs.mode.outputs.mode == 'only-packages' }}
        with:
          name: snapshot-config
          path: .artifacts
          run-id: ${{ steps.find-config.outputs.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        if: ${{ needs.mode.outputs.mode != 'from-config' && needs.mode.outputs.mode != 'only-packages' }}
        with:
          name: snapshot-config
          path: .artifacts
          github-token: ${{ github.token }}

      - name: Restore configured snapshot
        run: bash scripts/common.sh --restore config

      - name: Build free software packages in chroot
        run: bash scripts/07-packages.sh

      - name: Upload pacman repository
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: packages-repo
          path: /mnt/lfs/pkgrepo/
          retention-days: 30

  # ---------------------------------------------------------------
  # Job 6: deploy pacman repo to GitHub Pages
  # ---------------------------------------------------------------
  deploy-pages:
    name: Deploy to Pages
    needs: packages
    # Deploy whenever the packages repo built successfully — push and
    # workflow_dispatch alike. The old dispatch-only condition made this
    # job skip on every push ("This job was skipped" forever).
    # ROOT CAUSE #56: needs-success gating propagates TRANSITIVELY through
    # the chain (toolchain/base are SKIPPED in from-base/from-config modes,
    # which poisons descendants); without a status function the implicit
    # success() sees those ancestor skips and forces this job to skip even
    # though packages itself succeeded. !cancelled() opts out of the
    # implicit gate; the explicit result check keeps the intent.
    if: ${{ !cancelled() && needs.packages.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages-repo
          path: public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4